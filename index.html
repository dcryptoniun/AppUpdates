<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Updates - Current Versions</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>App Updates</h1>
            <p class="subtitle">Current Public Versions</p>
        </header>

        <main>
            <section class="section">
                <h2>Games</h2>
                <div id="games-list" class="items-grid">
                    <div class="loading">Loading games...</div>
                </div>
            </section>

            <section class="section">
                <h2>Apps</h2>
                <div id="apps-list" class="items-grid">
                    <div class="loading">Loading apps...</div>
                </div>
            </section>
        </main>

        <footer>
            <p>Last updated: <span id="last-updated"></span></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
